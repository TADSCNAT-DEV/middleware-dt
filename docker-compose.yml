services:
  db:
    image: postgres:15
    container_name: middts_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-middts}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - middts_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    container_name: middts_redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "6379:6379"
    networks:
      - middts_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.8
    container_name: middts_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # Neo4j requires initial admin username to be `neo4j`.
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/middts123}
    volumes:
      - neo4j_data:/data
    networks:
      - middts_net
    healthcheck:
      # use $$ to escape $ so Compose doesn't interpolate; the expansion happens
      # inside the container shell at runtime
      test: ["CMD-SHELL", "USER=$${NEO4J_AUTH%%/*}; PASS=$${NEO4J_AUTH#*/}; cypher-shell -a bolt://localhost:7687 -u \"$$USER\" -p \"$$PASS\" 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  influxdb:
    image: influxdb:2.7
    container_name: middts_influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-middts}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-middts123}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORGANIZATION:-middts}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-iot_data}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-admin_token_middts}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_data_root:/root/.influxdbv2
    networks:
      - middts_net
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  parser:
    image: andregustavoo/parserwebapi:latest
    container_name: middts_parser
    ports:
      - "8082:8080"
      - "8083:8081"
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    restart: unless-stopped
    networks:
      - middts_net

  middleware:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: middts_middleware
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-middts}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-middts123}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-middts@example.com}
      DJANGO_SETTINGS_MODULE: middleware_dt.settings_base
      HOST_IP: ${HOST_IP:-10.22.1.247}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,https://localhost,http://127.0.0.1,https://127.0.0.1,http://localhost:8000,https://localhost:8000,https://*.app.github.dev,https://*.github.dev}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-middts}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-middts}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NEO4J_URL: "bolt://neo4j:7687"
      NEO4J_BOLT_URL: "bolt://neo4j:7687"
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-middts123}
      USE_NEO4J: "True"
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-iot_data}
      INFLUXDB_ORGANIZATION: ${INFLUXDB_ORGANIZATION:-middts}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-admin_token_middts}
      DTDL_PARSER_URL: ${DTDL_PARSER_URL:-http://parser:8080/api/DTDLModels/parse/}
      START_LISTENER_AFTER_TB: ${START_LISTENER_AFTER_TB:-0}
      THINGSBOARD_HOST: ${MIDDLEWARE_THINGSBOARD_HOST:-demo.thingsboard.io}
      TB_HOST: ${MIDDLEWARE_TB_HOST:-demo.thingsboard.io}
      TB_PORT: ${MIDDLEWARE_TB_PORT:-443}
      TB_SCHEME: ${MIDDLEWARE_TB_SCHEME:-https}
      # Neo4j/Cypher execution tuning
      CYPHER_QUERY_TIMEOUT: ${CYPHER_QUERY_TIMEOUT:-30}
      CYPHER_QUERY_MAX_ROWS: ${CYPHER_QUERY_MAX_ROWS:-1000}
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    volumes:
      - static_volume:/middleware-dt/static
    networks:
      - middts_net

  nginx:
    image: nginx:latest
    container_name: middts_nginx
    ports:
      - "${MIDDLEWARE_PORT:-8000}:80"
    depends_on:
      middleware:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/etc/nginx/staticfiles/static
    networks:
      - middts_net

  simulator:
    profiles: ["simulator"]
    # Note: `make build` and `make up` include this profile by default.
    build:
      context: ${SIMULATOR_CONTEXT:-./iot_simulator}
      dockerfile: Dockerfile
    container_name: iot_simulator
    depends_on:
      influxdb:
        condition: service_healthy
      middleware:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: iot_simulator.settings_base
      DEBUG: ${SIMULATOR_DEBUG:-False}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      ALLOWED_HOSTS: ${SIMULATOR_ALLOWED_HOSTS:-*}
      SQLITE_DB_PATH: /data/db.sqlite3
      SIMULATOR_SEED_DB_ON_FIRST_BOOT: ${SIMULATOR_SEED_DB_ON_FIRST_BOOT:-1}
      SIMULATOR_RESTORE_DB_ON_BOOT: ${SIMULATOR_RESTORE_DB_ON_BOOT:-0}
      RESET_SIM_DB: ${RESET_SIM_DB:-0}
      THINGSBOARD_HOST: ${SIMULATOR_THINGSBOARD_HOST:-https://demo.thingsboard.io}
      THINGSBOARD_USER: ${THINGSBOARD_USER:-tenant@thingsboard.org}
      THINGSBOARD_PASSWORD: ${THINGSBOARD_PASSWORD:-tenant}
      THINGSBOARD_MQTT_PORT: ${THINGSBOARD_MQTT_PORT:-1883}
      THINGSBOARD_MQTT_KEEP_ALIVE: ${THINGSBOARD_MQTT_KEEP_ALIVE:-60}
      HEARTBEAT_INTERVAL: ${HEARTBEAT_INTERVAL:-5}
      INFLUXDB_HOST: influxdb
      INFLUXDB_PORT: 8086
      INFLUXDB_BUCKET: ${SIMULATOR_INFLUXDB_BUCKET:-iot_data}
      INFLUXDB_ORGANIZATION: ${INFLUXDB_ORGANIZATION:-middts}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-admin_token_middts}
      # Shared gateway bootstrap (creates missing entries only), applied by make seed-house / make seed-gateway.
      SEED_THINGSBOARD_GATEWAY: ${SEED_THINGSBOARD_GATEWAY:-0}
      THINGSBOARD_GATEWAY_NAME: ${THINGSBOARD_GATEWAY_NAME:-ThingsBoard Demo}
      THINGSBOARD_GATEWAY_URL: ${THINGSBOARD_GATEWAY_URL:-}
      THINGSBOARD_AUTH_METHOD: ${THINGSBOARD_AUTH_METHOD:-api_key}
      THINGSBOARD_API_KEY: ${THINGSBOARD_API_KEY:-}
      SIMULATOR_NUMBER: ${SIMULATOR_NUMBER:-1}
      RANDOMIZE: ${RANDOMIZE:-1}
      USE_MEMORY_STATE: ${USE_MEMORY_STATE:-1}
      SIMULATOR_AUTO_START: ${SIMULATOR_AUTO_START:-1}
    ports:
      - "${SIMULATOR_PORT:-8001}:8001"
    restart: unless-stopped
    volumes:
      - simulator_data:/data
    networks:
      - middts_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8001/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6

  client:
    profiles: ["client"]
    # Note: `make build` and `make up` include this profile by default.
    build:
      context: ${CLIENT_CONTEXT:-./middts-client}
      dockerfile: Dockerfile
    container_name: middts_client
    depends_on:
      nginx:
        condition: service_started
      middleware:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: client.settings
      HOST_IP: ${HOST_IP:-10.22.1.247}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
      DEBUG: ${CLIENT_DEBUG:-True}
      # Allow the app to derive STATIC_URL from SITE_URL/HOST_IP when CLIENT_STATIC_URL is not set
      STATIC_URL: ${CLIENT_STATIC_URL:-}
      ALLOWED_HOSTS: ${CLIENT_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,client,${HOST_IP:-10.22.1.247}}
      SITE_URL: ${CLIENT_SITE_URL:-http://${HOST_IP:-10.22.1.247}:8002}
      MIDDTS_API_URL: ${CLIENT_MIDDTS_API_URL:-http://middleware:8000/api}
      MIDDTS_API_USERNAME: ${MIDDTS_API_USERNAME:-middts}
      MIDDTS_API_PASSWORD: ${MIDDTS_API_PASSWORD:-middts123}
      MIDDTS_API_TIMEOUT: ${MIDDTS_API_TIMEOUT:-10}
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-middts}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-middts123}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      CORS_ALLOWED_ORIGINS: ${CLIENT_CORS_ALLOWED_ORIGINS:-http://localhost:8000,https://localhost:8000,http://127.0.0.1:8000,https://127.0.0.1:8000,http://${HOST_IP:-10.22.1.247}:8000,https://${HOST_IP:-10.22.1.247}:8000,http://localhost:8002,https://localhost:8002,http://127.0.0.1:8002,https://127.0.0.1:8002,http://${HOST_IP:-10.22.1.247}:8002,https://${HOST_IP:-10.22.1.247}:8002}
      SQLITE_DB_PATH: /app/data/db.sqlite3
    command: >-
      sh -c "python manage.py migrate || true; python manage.py ensure_middts_user || true; python manage.py ensure_superuser || true; python manage.py collectstatic --noinput || true; gunicorn --bind 0.0.0.0:8002 --workers $${CLIENT_GUNICORN_WORKERS:-2} --timeout $${CLIENT_GUNICORN_TIMEOUT:-120} client.wsgi:application"
    ports:
      - "${CLIENT_PORT:-8002}:8002"
    restart: unless-stopped
    volumes:
      - client_data:/app/data
      - static_volume:/app/staticfiles
    networks:
      - middts_net
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8002/', timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 6

networks:
  middts_net:
    driver: bridge

volumes:
  db_data:
  static_volume:
  influxdb_data:
  influxdb_data_root:
  neo4j_data:
  client_data:
  simulator_data:
